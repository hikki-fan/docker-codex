# Conservative container defaults for codex-account-supervisor.
# Keep this file free of tokens, account data, and auth paths.

used_threshold_percent = 98.0
target_max_used_percent = 98.0
check_interval_seconds = 30.0
cooldown_seconds = 300.0

# 5h used >= threshold hard-stops the shared app-server and switches
# immediately. In-flight turns are dropped so credits are not used as overflow.
drain_timeout_seconds = 60.0
drain_poll_interval_seconds = 2.0
require_explicit_idle = true
turn_signal_stale_seconds = 30.0
preempt_in_flight_turns = true
halt_relay_when_exhausted = true
# The handoff hook first attempts to resume the same local rollout on the
# new account and falls back to a new thread only if the installed Codex
# version rejects that resume.
cross_account_resume = true

max_consecutive_failures = 3
circuit_break_cooldown_seconds = 600.0

base_dir = "/home/codex/.codex-supervisor"
state_file = "/home/codex/.codex-supervisor/state.json"
lock_file = "/home/codex/.codex-supervisor/supervisor.lock"
turn_signal_file = "/home/codex/.codex-supervisor/turn_state.json"
handoff_dir = "/home/codex/.codex-supervisor/handoffs"
workspace_path = "/workspace"

relay_pid_file = "~/.local/share/codex-relay/server.pid"
usage_command = "/home/codex/.local/bin/codex-switch --json list"
switch_command = "/home/codex/.local/bin/codex-switch use {alias}"
relay_start_command = "/usr/local/bin/codex-relay --bg --shared-app-server"
relay_stop_command = "/usr/local/bin/codex-relay stop"

# Starts a separate tmux Codex client against Relay's Unix app-server.  The
# hook is executed only after the cutover and health check succeed.
handoff_hook_command = "/usr/local/bin/codex-supervisor-new-thread --handoff {handoff_file} --resume-existing"

dry_run = false
log_level = "INFO"
